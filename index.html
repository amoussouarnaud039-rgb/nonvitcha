<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nonvitcha</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background: #eef2f5; padding: 15px; max-width: 800px; margin: 0 auto; color: #333; }
    
    /* Écran d'Auth */
    .auth-container { background: white; padding: 25px; border-radius: 12px; max-width: 380px; margin: 50px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .auth-container h2 { text-align: center; color: #e91e63; margin-bottom: 15px; }
    .auth-container input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    .btn-main { width: 100%; padding: 11px; background: #e91e63; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .toggle-auth { text-align: center; margin-top: 12px; font-size: 13px; color: #666; cursor: pointer; text-decoration: underline; }

    /* Barre utilisateur */
    .user-header { background: white; padding: 12px 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .btn-logout { background: #f44336; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }

    /* VIP & Boutique (Nonvicoins) */
    .vip-section { background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d); color: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .shop-grid { display: flex; gap: 10px; margin-top: 10px; justify-content: center; flex-wrap: wrap; }
    .shop-card { background: rgba(255, 255, 255, 0.15); padding: 10px 15px; border-radius: 8px; font-size: 13px; flex: 1; min-width: 140px; text-align: center; backdrop-filter: blur(5px); }
    .btn-shop { background: #fff; color: #b21f1f; border: none; padding: 5px 10px; border-radius: 5px; font-weight: bold; margin-top: 6px; cursor: pointer; font-size: 12px; }

    /* Filtres */
    .filter-section { background: #fff; padding: 12px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #e0e0e0; }
    .filter-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 5px; }
    .filter-grid input, .filter-grid select { padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; flex: 1; }

    /* Cartes Profils */
    .card { background: white; padding: 12px; border-radius: 10px; margin-bottom: 10px; display: flex; gap: 12px; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .profile-avatar { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; border: 2px solid #e91e63; }
    .badge { font-size: 10px; padding: 2px 6px; border-radius: 8px; font-weight: bold; }
    .badge-vip { background: gold; color: #000; }
    .btn-chat { background: #e91e63; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }

    /* Fenêtre de Discussion Privée */
    #chatModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 9999; }
    .chat-box-container { background: white; width: 95%; max-width: 450px; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
    .chat-modal-header { background: #e91e63; color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
    .close-chat { background: none; border: none; color: white; font-size: 18px; cursor: pointer; }
    #privateChatMessages { height: 320px; overflow-y: auto; background: #e5ddd5; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .msg-bubble { padding: 8px 12px; border-radius: 10px; font-size: 13px; max-width: 75%; word-break: break-word; }
    .msg-me { background: #dcf8c6; align-self: flex-end; }
    .msg-other { background: white; align-self: flex-start; }
    .chat-input-area { padding: 10px; display: flex; gap: 8px; background: #f0f0f0; }
    .chat-input-area input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    .chat-input-area button { padding: 10px 15px; background: #e91e63; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <!-- 1. ÉCRAN D'AUTHENTIFICATION -->
  <div id="authView" class="auth-container">
    <h2 id="authTitle">Connexion</h2>
    <input type="text" id="authPrenom" placeholder="Prénom">
    <input type="password" id="authPassword" placeholder="Mot de passe">
    <div id="extraFields" style="display: none;">
      <input type="number" id="authAge" placeholder="Âge" value="25">
      <input type="text" id="authVille" placeholder="Ville" value="Cotonou">
    </div>
    <button class="btn-main" onclick="soumettreAuth()">Se connecter</button>
    <div class="toggle-auth" onclick="basculerModeAuth()" id="toggleText">Pas encore de compte ? S'inscrire</div>
  </div>

  <!-- 2. TABLEAU DE BORD -->
  <div id="appView" style="display: none;">
    
    <div class="user-header">
      <div class="user-info">
        <img id="myAvatar" class="user-avatar" src="">
        <div>
          <strong id="myPrenom">...</strong>
          <div style="font-size: 12px; color: #666;">🪙 <span id="myCoins">0</span> Coins | <span id="myVip">Membre</span></div>
        </div>
      </div>
      <button class="btn-logout" onclick="deconnexion()">Déconnexion</button>
    </div>

    <!-- BOUTIQUE / VIP & NONVICOINS -->
    <div class="vip-section">
      <h3>⭐ Boutique Nonvitcha</h3>
      <p style="font-size: 12px; margin-top: 4px;">Achetez des Nonvicoins ou passez VIP pour booster vos rencontres !</p>
      <div class="shop-grid">
        <div class="shop-card">
          <strong>🪙 Pack 50 Coins</strong>
          <p style="font-size: 11px; margin: 3px 0;">Pour vos interactions</p>
          <button class="btn-shop" onclick="acheterBoutique('coins')">Acheter (1000F)</button>
        </div>
        <div class="shop-card">
          <strong>👑 Pass VIP 30j</strong>
          <p style="font-size: 11px; margin: 3px 0;">Visibilité maximale</p>
          <button class="btn-shop" onclick="acheterBoutique('vip')">Devenir VIP (5000F)</button>
        </div>
      </div>
    </div>

    <!-- FILTRES -->
    <div class="filter-section">
      <h4 style="font-size: 13px;">🔍 Filtrer & Trier</h4>
      <div class="filter-grid">
        <input type="text" id="filtreVille" placeholder="Ville..." oninput="filtrerEtAfficher()">
        <input type="number" id="filtreAgeMin" placeholder="Âge min" oninput="filtrerEtAfficher()">
        <select id="triSelect" onchange="filtrerEtAfficher()">
          <option value="defaut">Ordre classique</option>
          <option value="vip">VIP en premier</option>
          <option value="recent">Plus récents</option>
        </select>
      </div>
    </div>

    <h3 style="margin-bottom: 10px; font-size: 16px;">Profils membres</h3>
    <div id="profilsContainer"></div>

  </div>

  <!-- MODALE CHAT PRIVÉ -->
  <div id="chatModal">
    <div class="chat-box-container">
      <div class="chat-modal-header">
        <span id="chatWithTitle">Discussion</span>
        <button class="close-chat" onclick="fermerChat()">✕</button>
      </div>
      <div id="privateChatMessages"></div>
      <div class="chat-input-area">
        <input type="text" id="privateInput" placeholder="Écrivez un message..." onkeypress="gererToucheEntree(event)">
        <button onclick="envoyerMessagePrive()">Envoyer</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let currentUser = null;
    let modeInscription = false;
    let tousLesProfils = [];
    let destinataireActifId = null;

    async function verifierSession() {
      try {
        const res = await fetch('/api/me');
        const data = await res.json();
        if (data.loggedIn) {
          currentUser = data.user;
          afficherApp();
        } else {
          afficherAuth();
        }
      } catch (e) {
        afficherAuth();
      }
    }

    function basculerModeAuth() {
      modeInscription = !modeInscription;
      document.getElementById('authTitle').textContent = modeInscription ? "Inscription" : "Connexion";
      document.getElementById('extraFields').style.display = modeInscription ? "block" : "none";
      document.querySelector('.btn-main').textContent = modeInscription ? "S'inscrire" : "Se connecter";
      document.getElementById('toggleText').textContent = modeInscription ? "Déjà un compte ? Se connecter" : "Pas encore de compte ? S'inscrire";
    }

    async function soumettreAuth() {
      const prenom = document.getElementById('authPrenom').value.trim();
      const password = document.getElementById('authPassword').value;
      const endpoint = modeInscription ? '/api/register' : '/api/login';

      if (!prenom || !password) return alert('Veuillez remplir tous les champs');

      const body = { prenom, password };
      if (modeInscription) {
        body.age = document.getElementById('authAge').value;
        body.ville = document.getElementById('authVille').value;
      }

      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (data.success) {
        verifierSession();
      } else {
        alert(data.message);
      }
    }

    async function deconnexion() {
      await fetch('/api/logout', { method: 'POST' });
      currentUser = null;
      afficherAuth();
    }

    function afficherAuth() {
      document.getElementById('authView').style.display = 'block';
      document.getElementById('appView').style.display = 'none';
    }

    function afficherApp() {
      document.getElementById('authView').style.display = 'none';
      document.getElementById('appView').style.display = 'block';
      document.getElementById('myPrenom').textContent = currentUser.prenom;
      document.getElementById('myAvatar').src = currentUser.avatar;
      document.getElementById('myCoins').textContent = currentUser.credits || 0;
      document.getElementById('myVip').textContent = currentUser.estVip ? '👑 VIP' : 'Membre';
      chargerProfils();
    }

    async function chargerProfils() {
      const res = await fetch('/api/profils');
      const data = await res.json();
      tousLesProfils = (data.data || []).filter(p => p.id !== currentUser.id);
      filtrerEtAfficher();
    }

    function filtrerEtAfficher() {
      const qVille = document.getElementById('filtreVille').value.toLowerCase().trim();
      const ageMin = parseInt(document.getElementById('filtreAgeMin').value, 10) || 0;
      const tri = document.getElementById('triSelect').value;

      let liste = tousLesProfils.filter(p => {
        const matchVille = !qVille || (p.ville && p.ville.toLowerCase().includes(qVille));
        const matchAge = parseInt(p.age, 10) >= ageMin;
        return matchVille && matchAge;
      });

      if (tri === 'vip') {
        liste.sort((a, b) => (b.estVip ? 1 : 0) - (a.estVip ? 1 : 0));
      } else if (tri === 'recent') {
        liste.sort((a, b) => b.id - a.id);
      }

      const container = document.getElementById('profilsContainer');
      container.innerHTML = '';
      liste.forEach(p => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
          <img src="${p.avatar}" class="profile-avatar">
          <div style="flex: 1;">
            <h4>${p.prenom}, ${p.age} ans ${p.estVip ? '<span class="badge badge-vip">👑 VIP</span>' : ''}</h4>
            <p style="font-size: 12px; color: #666;">📍 ${p.ville} | 🪙 ${p.credits} Coins</p>
          </div>
          <button class="btn-chat" onclick="ouvrirChat(${p.id}, '${p.prenom}')">💬 Discuter</button>
        `;
        container.appendChild(div);
      });
    }

    function acheterBoutique(type) {
      alert(`Redirection vers le paiement FedaPay pour : ${type === 'vip' ? 'Pass VIP (5000F)' : 'Pack 50 Nonvicoins (1000F)'}`);
    }

    async function ouvrirChat(destId, destPrenom) {
      destinataireActifId = destId;
      document.getElementById('chatWithTitle').textContent = `Discussion avec ${destPrenom}`;
      document.getElementById('chatModal').style.display = 'flex';
      
      const box = document.getElementById('privateChatMessages');
      box.innerHTML = '<div style="text-align:center; color:#999; margin-top:10px;">Chargement...</div>';

      try {
        const res = await fetch(`/api/messages/${destId}`);
        if (res.ok) {
          const data = await res.json();
          box.innerHTML = '';
          if (data.success && data.messages) {
            data.messages.forEach(m => {
              ajouterBulleMessage(m.text, m.senderId === currentUser.id);
            });
          }
        }
      } catch (e) {
        box.innerHTML = '';
      }
    }

    function fermerChat() {
      document.getElementById('chatModal').style.display = 'none';
      destinataireActifId = null;
    }

    function envoyerMessagePrive() {
      const input = document.getElementById('privateInput');
      const text = input.value.trim();
      if (!text || !destinataireActifId) return;

      socket.emit('private message', { senderId: currentUser.id, receiverId: destinataireActifId, text: text });
      input.value = '';
    }

    function gererToucheEntree(e) {
      if (e.key === 'Enter') envoyerMessagePrive();
    }

    function ajouterBulleMessage(text, isMe) {
      const box = document.getElementById('privateChatMessages');
      const bubble = document.createElement('div');
      bubble.className = `msg-bubble ${isMe ? 'msg-me' : 'msg-other'}`;
      bubble.textContent = text;
      box.appendChild(bubble);
      box.scrollTop = box.scrollHeight;
    }

    socket.on('private message', data => {
      if (
        (data.senderId === currentUser.id && data.receiverId === destinataireActifId) ||
        (data.senderId === destinataireActifId && data.receiverId === currentUser.id)
      ) {
        ajouterBulleMessage(data.text, data.senderId === currentUser.id);
      }
    });

    verifierSession();
  </script>
</body>
</html>
