<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration - Nonvitcha</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; color: #333; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { color: #e91e63; }
    .demande { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 6px; background: #fafafa; }
    button { background: #f44336; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    a { display: inline-block; margin-bottom: 15px; color: #2196F3; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <a href="/">← Retour à l'application</a>
    <h1>🔒 Gestion des Demandes d'Écoute</h1>
    <div id="admin-list"><p>Chargement des demandes...</p></div>
  </div>

  <script>
    async function chargerDemandes() {
      try {
        const res = await fetch('/api/admin/ecoutes');
        const data = await res.json();
        const container = document.getElementById('admin-list');
        
        if (data.length === 0) {
          container.innerHTML = '<p>Aucune demande d écoute pour le moment.</p>';
          return;
        }

        container.innerHTML = data.map(d => `
          <div class="demande">
            <small>Par : <strong>${d.nom_utilisateur || 'Anonyme'}</strong> - ${new Date(d.date_creation).toLocaleString()}</small>
            <p><strong>Sujet :</strong> ${d.sujet}</p>
            <p><strong>Message :</strong> ${d.message}</p>
            <button onclick="supprimerDemande('${d.id}')">Traiter / Supprimer</button>
          </div>
        `).join('');
      } catch (e) {
        document.getElementById('admin-list').innerHTML = '<p style="color:red;">Erreur de chargement ou accès non autorisé.</p>';
      }
    }

    async function supprimerDemande(id) {
      if (!confirm("Voulez-vous supprimer cette demande ?")) return;
      await fetch(`/api/admin/ecoutes/${id}`, { method: 'DELETE' });
      chargerDemandes();
    }

    chargerDemandes();
  </script>
</body>
</html>
