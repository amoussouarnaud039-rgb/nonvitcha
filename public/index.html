<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nonvitcha - Rencontres & Tchat</title>
  <script src="https://cdn.fedapay.com/checkout.js?v=1.1.7"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root { --primary: #e91e63; --bg: #f5f5f5; --card-bg: #ffffff; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; color: #333; }
    .container { max-width: 900px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; background: var(--primary); color: white; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; }
    .card { background: var(--card-bg); padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .hidden { display: none !important; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
    .user-card { border: 1px solid #ddd; border-radius: 8px; padding: 15px; text-align: center; background: #fff; position: relative; }
    .user-card img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; }
    .badge-vip { background: #ffd700; color: #000; font-weight: bold; padding: 2px 8px; border-radius: 12px; font-size: 0.8em; }
    .badge-unread { background: #e91e63; color: white; border-radius: 50%; padding: 2px 6px; font-size: 0.75em; position: absolute; top: 10px; right: 10px; font-weight: bold; }
    .status-dot { height: 10px; width: 10px; background-color: #bbb; border-radius: 50%; display: inline-block; margin-right: 5px; }
    .status-online { background-color: #4CAF50; box-shadow: 0 0 5px #4CAF50; }
    button { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-top: 5px; }
    button:hover { opacity: 0.9; }
    button.btn-alt { background: #333; }
    button.btn-blue { background: #2196F3; }
    button.btn-danger { background: #f44336; padding: 2px 6px; font-size: 0.7em; margin-left: 10px; }
    input, select, textarea { width: 100%; padding: 8px; margin: 5px 0 15px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    .chat-box { height: 200px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; background: #fafafa; margin-bottom: 10px; border-radius: 5px; }
    .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
    .filter-bar input, .filter-bar select { flex: 1; min-width: 150px; margin: 0; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Nonvitcha 💕</h1>
    <div id="header-auth"></div>
  </header>

  <!-- CONNEXION / INSCRIPTION -->
  <div id="auth-section" class="card">
    <h2>Connexion / Inscription</h2>
    <div style="display: flex; gap: 20px; flex-wrap: wrap;">
      <div style="flex: 1; min-width: 250px;">
        <h3>Se connecter</h3>
        <input type="email" id="login-email" placeholder="Email">
        <input type="password" id="login-pass" placeholder="Mot de passe">
        <button onclick="login()">Se connecter</button>
      </div>
      <div style="flex: 1; min-width: 250px;">
        <h3>S'inscrire</h3>
        <input type="email" id="reg-email" placeholder="Email" required>
        <input type="password" id="reg-pass" placeholder="Mot de passe" required>
        <input type="text" id="reg-nom" placeholder="Nom" required>
        <input type="number" id="reg-age" placeholder="Âge" required>
        <input type="text" id="reg-ville" placeholder="Ville" required>
        <button onclick="register()">Créer un compte</button>
      </div>
    </div>
  </div>

  <!-- APPLICATION -->
  <div id="app-section" class="hidden">
    <div class="card" id="profile-card"></div>

    <div class="card">
      <h2>📚 Salle d'Information et d'Écoute</h2>
      <div style="margin-bottom: 15px; display: flex; gap: 5px; flex-wrap: wrap;">
        <button onclick="chargerRessources()">Tous</button>
        <button onclick="chargerRessources('SSR')" class="btn-blue">SSR</button>
        <button onclick="chargerRessources('VBG')" style="background: #e91e63;">VBG</button>
        <button onclick="chargerRessources('MINORITES')" class="btn-alt">Minorités</button>
      </div>
      <div id="liste-ressources" style="max-height: 250px; overflow-y: auto; margin-bottom: 20px; border: 1px solid #ddd; padding: 10px; border-radius: 5px; background: #fafafa;"></div>

      <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

      <h3>💬 Demande d'écoute confidentielle</h3>
      <form id="form-ecoute" onsubmit="envoyerDemandeEcoute(event)">
        <input type="text" id="sujet-ecoute" placeholder="Sujet" required>
        <textarea id="message-ecoute" placeholder="Exprimez-vous..." style="height: 80px;" required></textarea>
        <button type="submit" style="background-color: #4CAF50;">Envoyer en toute confidentialité</button>
      </form>
      <p id="feedback-ecoute" style="margin-top: 8px; font-weight: bold;"></p>
    </div>

    <div id="private-chat-section" class="card hidden" style="border: 2px solid #2196F3;">
      <h2>Discussion privée avec <span id="chat-target-name" style="color: #2196F3;"></span></h2>
      <div id="private-chat-box" class="chat-box"></div>
      <div id="typing-indicator" style="font-size: 0.85em; color: #666; font-style: italic; height: 20px; margin-bottom: 5px;"></div>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="private-msg-input" placeholder="Message privé..." oninput="notifyTyping()" onkeypress="handlePrivateKeyPress(event)">
        <button onclick="sendPrivateMessage()" class="btn-blue">Envoyer</button>
        <button onclick="closePrivateChat()" class="btn-alt">Fermer</button>
      </div>
    </div>

    <div class="card">
      <h2>Membres Nonvitcha</h2>
      <div class="filter-bar">
        <input type="text" id="search-name" placeholder="🔍 Rechercher..." oninput="filterAndRenderUsers()">
        <input type="text" id="search-ville" placeholder="📍 Ville..." oninput="filterAndRenderUsers()">
        <select id="filter-status" onchange="filterAndRenderUsers()">
          <option value="all">Tous</option>
          <option value="vip">VIP ⭐</option>
          <option value="online">En ligne 🟢</option>
        </select>
      </div>
      <div id="users-list" class="grid"></div>
    </div>

    <div class="card">
      <h2>Tchat Public 💬</h2>
      <div id="public-chat" class="chat-box"></div>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="public-msg-input" placeholder="Message public..." onkeypress="handlePublicKeyPress(event)">
        <button onclick="sendPublicMessage()">Envoyer</button>
      </div>
    </div>
  </div>
</div>

<script>
  let currentUser = null;
  let activeTargetId = null;
  let allUsersCache = [];
  let onlineIdsCache = [];
  let unreadCountsCache = {};
  let typingTimeout = null;
  const socket = io();

  async function checkAuth() {
    const res = await fetch('/api/auth/me');
    const data = await res.json();
    if (data.loggedIn) {
      currentUser = data.user;
      showAppUI();
      initSocketsListeners();
      chargerRessources();
    } else {
      currentUser = null;
      showAuthUI();
    }
  }

  function showAuthUI() {
    document.getElementById('auth-section').classList.remove('hidden');
    document.getElementById('app-section').classList.add('hidden');
    document.getElementById('header-auth').innerHTML = '';
  }

  function showAppUI() {
    document.getElementById('auth-section').classList.add('hidden');
    document.getElementById('app-section').classList.remove('hidden');
    document.getElementById('header-auth').innerHTML = `
      <span>Bonjour, <strong>${currentUser.nom}</strong></span>
      <a href="/admin.html" style="color:white; margin-left:15px; text-decoration:underline;">Admin</a>
      <button onclick="logout()" class="btn-alt" style="margin-left:10px;">Déconnexion</button>
    `;
    renderProfile();
    loadUsersData();
    loadPublicChat();
  }

  function initSocketsListeners() {
    socket.off('new-public-message');
    socket.on('new-public-message', (m) => {
      const box = document.getElementById('public-chat');
      const canDelete = m.sender === currentUser.nom ? `<button class="btn-danger" onclick="deletePublicMessage('${m.id}')">Supprimer</button>` : '';
      box.innerHTML += `<div id="pub-msg-${m.id}"><strong>[${m.date}] ${m.sender} :</strong> ${m.text} ${canDelete}</div>`;
      box.scrollTop = box.scrollHeight;
    });
    socket.off('update-users');
    socket.on('update-users', loadUsersData);
    socket.off(`private-message-${currentUser.id}`);
    socket.on(`private-message-${currentUser.id}`, () => { if (activeTargetId) loadPrivateMessages(); });
    socket.off(`unread-update-${currentUser.id}`);
    socket.on(`unread-update-${currentUser.id}`, loadUsersData);
  }

  async function login() {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('login-email').value, password: document.getElementById('login-pass').value })
    });
    const data = await res.json();
    if (data.success) checkAuth(); else alert(data.message);
  }

  async function register() {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('reg-email').value,
        password: document.getElementById('reg-pass').value,
        nom: document.getElementById('reg-nom').value,
        age: document.getElementById('reg-age').value,
        ville: document.getElementById('reg-ville').value
      })
    });
    const data = await res.json();
    if (data.success) checkAuth(); else alert(data.message);
  }

  async function logout() {
    await fetch('/api/auth/logout', { method: 'POST' });
    checkAuth();
  }

  function renderProfile() {
    document.getElementById('profile-card').innerHTML = `
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;">
        <div style="text-align: center;">
          <img src="${currentUser.photo}" style="width: 90px; height: 90px; border-radius: 50%; object-fit: cover;"><br>
          <input type="file" id="photo-input" accept="image/*" style="margin-top: 10px; width: 160px; font-size: 0.8em;">
          <button onclick="uploadPhoto()" style="padding: 4px 8px; font-size: 0.8em;">Changer</button>
        </div>
        <div style="flex: 1;">
          <h2>Mon Profil ${currentUser.isVip ? '<span class="badge-vip">⭐ VIP</span>' : ''}</h2>
          <p><strong>Nom :</strong> ${currentUser.nom} (${currentUser.age} ans) - ${currentUser.ville}</p>
          <p><strong>Likes :</strong> ❤️ ${currentUser.likes || 0}</p>
          <p><strong>Solde :</strong> 💰 <strong>${currentUser.nonvicoins || 0}</strong> Nonvicoins</p>
        </div>
        <div>
          <button onclick="buyCoins()">Acheter +50 Coins</button><br>
          ${!currentUser.isVip ? '<button onclick="becomeVip()" style="background: #ffd700; color: #000;">Passer VIP (100c)</button>' : ''}
        </div>
      </div>
    `;
  }

  async function uploadPhoto() {
    const file = document.getElementById('photo-input').files[0];
    if (!file) return alert('Sélectionnez une image');
    const fd = new FormData(); fd.append('photo', file);
    const res = await fetch('/api/users/upload-photo', { method: 'POST', body: fd });
    const data = await res.json();
    if (data.success) { currentUser = data.user; renderProfile(); loadUsersData(); alert('Photo mise à jour !'); }
  }

  function buyCoins() {
    FedaPay.init({
      public_key: 'pk_live_nL75JBWaRG69V8iMo6-7mMor',
      transaction: { amount: 500, description: '50 Nonvicoins' },
      customer: { email: currentUser.email, firstname: currentUser.nom }
    }).open().then(async () => {
      await fetch(`/api/users/${currentUser.id}/buy-coins`, { method: 'POST' });
      checkAuth();
      alert('Paiement réussi !');
    });
  }

  async function becomeVip() {
    const res = await fetch(`/api/users/${currentUser.id}/become-vip`, { method: 'POST' });
    const data = await res.json();
    if (data.success) { checkAuth(); alert('Bienvenue VIP ⭐'); } else alert(data.message);
  }

  async function loadUsersData() {
    const [uRes, oRes, unRes] = await Promise.all([fetch('/api/users'), fetch('/api/online-users'), fetch('/api/unread-messages')]);
    allUsersCache = await uRes.json();
    onlineIdsCache = await oRes.json();
    unreadCountsCache = await unRes.json();
    filterAndRenderUsers();
  }

  function filterAndRenderUsers() {
    const name = document.getElementById('search-name').value.toLowerCase();
    const ville = document.getElementById('search-ville').value.toLowerCase();
    const status = document.getElementById('filter-status').value;

    document.getElementById('users-list').innerHTML = allUsersCache.filter(u => {
      if (u.id === currentUser.id) return false;
      if (!u.nom.toLowerCase().includes(name) || !u.ville.toLowerCase().includes(ville)) return false;
      if (status === 'vip' && !u.isVip) return false;
      if (status === 'online' && !onlineIdsCache.includes(String(u.id))) return false;
      return true;
    }).map(u => `
      <div class="user-card">
        ${unreadCountsCache[u.id] ? `<span class="badge-unread">${unreadCountsCache[u.id]}</span>` : ''}
        <img src="${u.photo}">
        <h3>${u.nom} ${u.isVip ? '<span class="badge-vip">⭐</span>' : ''}</h3>
        <p><span class="${onlineIdsCache.includes(String(u.id)) ? 'status-dot status-online' : 'status-dot'}"></span>${u.age} ans - ${u.ville}</p>
        <button onclick="likeUser('${u.id}')">❤️ (${u.likes || 0})</button>
        <button onclick="openPrivateChat('${u.id}', '${u.nom}')" class="btn-blue">💬 Discuter</button>
      </div>
    `).join('');
  }

  async function likeUser(id) { await fetch(`/api/users/${id}/like`, { method: 'POST' }); loadUsersData(); }

  async function chargerRessources(cat = '') {
    const res = await fetch(`/api/ressources${cat ? '?categorie=' + cat : ''}`);
    const data = await res.json();
    document.getElementById('liste-ressources').innerHTML = data.map(r => `
      <div style="background: white; padding: 10px; margin-bottom: 8px; border-radius: 5px; border: 1px solid #ddd;">
        <strong style="color: var(--primary);">${r.titre}</strong> (${r.categorie})<br>${r.contenu}
      </div>
    `).join('') || '<p>Aucune ressource.</p>';
  }

  async function envoyerDemandeEcoute(e) {
    e.preventDefault();
    const res = await fetch('/api/ecoute', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sujet: document.getElementById('sujet-ecoute').value, message: document.getElementById('message-ecoute').value })
    });
    const data = await res.json();
    document.getElementById('feedback-ecoute').textContent = data.message || data.error;
    document.getElementById('form-ecoute').reset();
  }

  async function loadPublicChat() {
    const res = await fetch('/api/chat');
    const msgs = await res.json();
    document.getElementById('public-chat').innerHTML = msgs.map(m => `
      <div id="pub-msg-${m.id}"><strong>[${m.date}] ${m.sender} :</strong> ${m.text} ${m.sender === currentUser.nom ? `<button class="btn-danger" onclick="deletePublicMessage('${m.id}')">Suppr</button>` : ''}</div>
    `).join('');
  }

  async function deletePublicMessage(id) { await fetch(`/api/chat/${id}`, { method: 'DELETE' }); }
  function sendPublicMessage() {
    const i = document.getElementById('public-msg-input');
    if (i.value.trim()) { socket.emit('send-public-message', { sender: currentUser.nom, text: i.value.trim() }); i.value = ''; }
  }
  function handlePublicKeyPress(e) { if (e.key === 'Enter') sendPublicMessage(); }

  function openPrivateChat(id, name) {
    activeTargetId = id;
    document.getElementById('chat-target-name').textContent = name;
    document.getElementById('private-chat-section').classList.remove('hidden');
    loadPrivateMessages();
  }
  function closePrivateChat() { activeTargetId = null; document.getElementById('private-chat-section').classList.add('hidden'); }
  async function loadPrivateMessages() {
    const res = await fetch(`/api/private-messages/${activeTargetId}`);
    const msgs = await res.json();
    document.getElementById('private-chat-box').innerHTML = msgs.map(m => `<div><strong>[${m.date}] ${m.senderName} :</strong> ${m.text}</div>`).join('');
  }
  function sendPrivateMessage() {
    const i = document.getElementById('private-msg-input');
    if (i.value.trim() && activeTargetId) {
      socket.emit('send-private-message', { senderId: currentUser.id, senderName: currentUser.nom, targetId: activeTargetId, text: i.value.trim() });
      i.value = '';
    }
  }
  function notifyTyping() { socket.emit('typing', { targetId: activeTargetId, senderName: currentUser.nom }); }
  function handlePrivateKeyPress(e) { if (e.key === 'Enter') sendPrivateMessage(); }

  checkAuth();
</script>
</body>
</html>
